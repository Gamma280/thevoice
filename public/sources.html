<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Where your audience quotes come from">
  <title>Sources — TheVoice</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="sources">
  <header id="site-header"></header>
  <main id="main" class="container">
    <div class="row between">
      <h1>Sources</h1>
      <button type="button" id="collect" class="btn">Collect now</button>
    </div>
    <p class="muted">TheVoice reads real reviews and posts and keeps the ones that sound like pain. It refreshes automatically every few hours.</p>
    <div id="status" aria-live="polite"></div>
    <div id="results" class="field" aria-live="polite"></div>
    <div id="sources" class="stack field"></div>
    <div id="quotes" class="field"></div>
  </main>
</body>
</html>
