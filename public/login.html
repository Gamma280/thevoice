<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Log in to TheVoice">
  <title>Log in — TheVoice</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="login">
  <header id="site-header"></header>
  <main id="main" class="container narrow">
    <h1>Welcome back</h1>
    <p class="muted">Log in to see what your audience is saying.</p>
    <form id="auth-form" class="card stack" novalidate>
      <div id="form-error" aria-live="polite"></div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" minlength="8" required>
        <p class="hint">&nbsp;</p>
      </div>
      <button type="submit" id="submit" class="btn">Log in</button>
    </form>
    <p class="muted">New here? <a href="/signup.html">Create an account</a></p>
  </main>
</body>
</html>
